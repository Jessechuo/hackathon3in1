{% extends "base.html" %}

{% block content %}
<style>
  .auth { max-width:380px; padding:48px var(--xl); }
  .auth h1 { margin:0 0 var(--md); }
  .auth .lede { color:var(--fg-muted); margin:0 0 var(--xl); line-height:1.6; font-size:13px; }
  .auth .field { display:block; margin-bottom:var(--lg); }
  .auth .lbl {
    display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--fg-subtle); font-weight:600; margin-bottom:6px; }
  .auth input {
    width:100%; box-sizing:border-box; padding:9px 11px;
    border:1px solid var(--border); border-radius:var(--r-ctl);
    background:var(--l1); color:var(--fg); font:inherit; font-size:13px; }
  .auth input:focus-visible {
    outline:2px solid var(--primary); outline-offset:-1px; border-color:var(--primary); }
  .auth button {
    width:100%; height:34px; margin-top:var(--md); border:0; border-radius:var(--r-ctl);
    background:var(--primary); color:var(--on-primary);
    font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .auth button:hover { filter:brightness(1.08); }
  .auth button[disabled] { opacity:.45; cursor:not-allowed; }
  .err {
    padding:var(--md) var(--lg); margin-bottom:var(--lg);
    border:1px solid var(--border); border-left:3px solid var(--mismatch);
    border-radius:var(--r-ctl); background:var(--l1);
    color:var(--fg); font-size:13px; line-height:1.5; }
  .alt { margin-top:var(--xl); font-size:12px; color:var(--fg-subtle); line-height:1.6; }
  .alt a { color:var(--primary); }
  .hint { color:var(--fg-subtle); font-size:12px; margin:6px 0 0; line-height:1.5; }
  .hint code { font-family:var(--mono); font-size:11px;
    background:var(--l2); padding:1px 4px; border-radius:var(--r-badge); }
</style>

<div class="auth">
  <h1 class="t-headline-sm">{% block heading %}{% endblock %}</h1>
  <p class="lede">{% block lede %}{% endblock %}</p>

  {% if error %}<p class="err">{{ error }}</p>{% endif %}

  {% block form %}{% endblock %}
</div>
{% endblock %}
